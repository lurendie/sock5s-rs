[package]
name = "sock5s"
version = "0.4.0"
edition = "2024"
license = "MIT"

description = "A lightweight SOCKS5 proxy server written in Rust."
authors = ["nanpuyue <nanpuyue@gmail.com>"]

homepage = "https://github.com/nanpuyue/sock5s"
repository = "https://github.com/nanpuyue/sock5s.git"

keywords = ["socks5", "proxy", "server", "tcp", "udp"]
categories = ["command-line-utilities"]

include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE*",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version="4.5.54", features = ["derive"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
dioxus = { version = "0.6.3", features = ["desktop"] }
dioxus-desktop = "0.6.3"
eframe = "0.33.0"
ipnet = { version = "2.11.0", features = ["serde"] }
indoc = "2.0.7"
libc = "0.2.180"
serde = { version = "1.0.228", features = ["derive"] }
socket2 = "0.6.2"
tokio = { version = "1.49.0", features = ["io-util", "macros", "rt-multi-thread", "net"] }
tokio-stream = "0.1.18"
toml = "0.9.7"
tray-icon = "0.19.3"
